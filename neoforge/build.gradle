plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net' // Create, Ponder, Flywheel
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.ithundxr.dev/snapshots'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Create and the libraries it needs at dev runtime (layout from https://wiki.createmod.net/developers/).
    modImplementation("com.simibubi.create:create-$rootProject.minecraft_version:$rootProject.create_version:slim") { transitive = false }
    modImplementation "net.createmod.ponder:ponder-neoforge:$rootProject.ponder_version+mc$rootProject.minecraft_version"
    modCompileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-$rootProject.minecraft_version:$rootProject.flywheel_version"
    modRuntimeOnly "dev.engine-room.flywheel:flywheel-neoforge-$rootProject.minecraft_version:$rootProject.flywheel_version"
    modImplementation "com.tterrag.registrate:Registrate:$rootProject.registrate_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
